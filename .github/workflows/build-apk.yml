
name: Build WifiInspect APK

on:
  push:
    paths:
      - 'WifiInspect-V2-ready.zip'
      - 'WifiInspect-ready.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP (prefer V2)
        run: |
          ZIP_FILE=""

          if [ -f "WifiInspect-V2-ready.zip" ]; then
            ZIP_FILE="WifiInspect-V2-ready.zip"
          elif [ -f "WifiInspect-ready.zip" ]; then
            ZIP_FILE="WifiInspect-ready.zip"
          else
            ZIP_FILE=$(find . -maxdepth 3 -type f \( \
              -iname "WifiInspect-V2-ready.zip" -o \
              -iname "WifiInspect-ready.zip" \
              \) | sort | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "No WifiInspect ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          ROOT=$(find project -type f -name "settings.gradle.kts" \
            -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "settings.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          gradle -p "$PROJECT_ROOT" assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WifiInspect-V2-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
